:root{--bg:hsl(16 38% 94%);--panel:hsl(351 35% 91%);--ink:hsl(351 21% 32%);--muted:hsl(351 19.25% 41%);--selected:hsl(351 35% 86%);--line:hsl(351 22.75% 42% / .176);--radius:22px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Instrument,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{width:calc(100% - 32px);margin:32px auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 4px 20px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}header span:last-child{letter-spacing:.02em;text-transform:none}
.panels{display:grid;gap:10px}.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden;min-width:0}.list{position:relative;padding:12px}
.selection{position:absolute;top:0;left:12px;right:12px;background:var(--selected);border-radius:14px;pointer-events:none;will-change:transform,height}
.tabs{position:relative;display:grid;height:100%}button{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:68px;padding:20px 18px;border:0;background:transparent;color:var(--muted);font:inherit;line-height:1.4;text-align:left;cursor:pointer;touch-action:manipulation}button+button:before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:var(--line)}button[aria-selected=true]{color:var(--ink)}button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px;border-radius:14px}.arrow{opacity:0;transform:translate(-5px,5px);transition:transform .25s,opacity .2s;flex-shrink:0}button[aria-selected=true] .arrow{opacity:1;transform:none}button:active{transform:scale(.985)}
.detail{position:relative;min-height:390px;background:#b5a5a5;isolation:isolate}
.detail>div,.nail-tip{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nail-colour{background:hsl(351 35% 72%);opacity:0;transition:opacity .65s ease}
.nail-gloss{background:linear-gradient(105deg,transparent 12%,rgb(255 255 255 / .25) 19%,rgb(255 255 255 / .08) 25%,transparent 36%);opacity:0;transform:translateX(-5%);transition:opacity .6s,transform .9s cubic-bezier(.2,.7,.2,1)}
.nail-tip{transform:translateY(30%);opacity:0;transition:transform .75s cubic-bezier(.22,.75,.22,1),opacity .4s ease}
.detail[data-look=french] .nail-tip{opacity:1;transform:translateY(0)}
.detail[data-look=colour] .nail-colour{opacity:1;animation:colour-cycle 16s linear infinite}
@keyframes colour-cycle{0%,20%{background:#245d61}25%,45%{background:#63334e}50%,70%{background:#954c3b}75%,95%{background:#354d72}100%{background:#245d61}}
.nail-glow-base{background:linear-gradient(100deg,#350308 0%,#680714 45%,#340107 100%);opacity:0;transition:opacity .6s ease}
.nail-glow-band{background:radial-gradient(ellipse 44% 16% at 50% 50%,rgb(255 251 255 / .95),rgb(246 226 255 / .8) 32%,rgb(236 201 243 / .4) 65%,transparent 100%);opacity:0;mix-blend-mode:screen;transform:translateY(-33%)}
.nail-reflection{background:radial-gradient(ellipse 2% 23% at 27% 47%,rgb(255 255 255 / .85),rgb(255 255 255 / .22) 65%,transparent 100%),radial-gradient(ellipse 1% 19% at 77% 40%,rgb(255 255 255 / .5),transparent 100%);opacity:0;transition:opacity .6s ease}
.detail[data-look=glow] .nail-glow-base,.detail[data-look=glow] .nail-reflection{opacity:1}
.detail[data-look=glow] .nail-glow-band{opacity:1;animation:glow-sweep 4s ease-in-out infinite}
@keyframes glow-sweep{0%,100%{transform:translateY(-33%)}50%{transform:translateY(33%)}}
.detail{color:#452d36;transition:color .6s ease}
.detail[data-look=colour],.detail[data-look=glow]{color:#fff7f1}
.detail>.panel-copy{inset:28px 24px;width:auto;height:auto;display:flex;flex-direction:column;justify-content:center;gap:18px;pointer-events:auto;z-index:2}
.detail[data-look=glow] .panel-copy{text-shadow:0 1px 3px rgb(30 0 8 / .7)}
.look-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.panel-copy h1{font:400 clamp(28px,2.5vw,36px)/1.15 Lora,Georgia,serif;letter-spacing:-.035em;margin:0;overflow-wrap:anywhere}
.panel-copy p{font-size:15px;line-height:1.65;margin:0;text-wrap:pretty}
.nail-ornament{opacity:0;transition:opacity .5s ease}
.detail[data-look=ornament] .nail-ornament{opacity:1}
.cluster{position:absolute;width:80px;height:100px}
.top-left{left:10px;top:14px;transform:rotate(-14deg)}
.bottom-right{right:4px;bottom:12px;transform:rotate(165deg)}
.edge{right:-8px;top:40%;transform:rotate(10deg);width:32px}
.cluster i{position:absolute;display:block;width:15px;height:22px;clip-path:polygon(50% 0,88% 20%,100% 60%,50% 100%,0 60%,12% 20%);background:conic-gradient(from 20deg,#fffaf8 0deg,#b1a4b3 55deg,#fff 90deg,#d8cad4 140deg,#9b91a1 185deg,#fff 225deg,#e6dce5 270deg,#aca0b0 315deg,#fffaf8 360deg);filter:drop-shadow(0 1px 2px #61475c);transform:rotate(25deg)}
.cluster i:after{content:"";position:absolute;inset:4px;background:linear-gradient(135deg,#fff,#fff7 40%,#8f8298 42%,#e7dce4 65%,#fff);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.cluster i:nth-child(1){left:14px;top:3px;width:20px;height:27px}
.cluster i:nth-child(2){left:37px;top:20px;transform:rotate(70deg)}
.cluster i:nth-child(3){left:8px;top:37px;transform:rotate(-20deg)}
.cluster i:nth-child(4){left:31px;top:56px;width:11px;height:16px}
.cluster i:nth-child(5){left:7px;top:74px;width:8px;height:11px}
.edge i:nth-child(1){left:10px;top:0;width:12px;height:17px}.edge i:nth-child(2){left:4px;top:28px;width:9px;height:13px}.edge i:nth-child(3){left:13px;top:53px;width:7px;height:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.hint{font-size:12px;line-height:1.6;color:var(--muted);margin:16px 4px 0}
@media(min-width:800px){:root{--radius:32px}body{min-height:100svh;display:grid;place-items:center}main{width:min(calc(100% - 32px),calc(71.53vw + 1.485px));max-width:1057.404px;margin:32px auto}.panels{grid-template-columns:1.1fr .455fr;height:66svh;min-height:440px;max-height:690px}.list{padding:18px}.selection{left:18px;right:18px;border-radius:19px}.tabs{grid-template-rows:repeat(5,1fr)}button{min-height:0;padding:16px 24px;font-size:clamp(16px,1.35vw,19px)}button+button:before{left:24px;right:24px}.hint{margin-top:18px}}

.has-3d .detail{background:transparent;border-color:transparent;overflow:visible}

<script>
'use strict';
// Abstract visual studies, not additional treatment claims. No external requests.

const looks=["basic","french","colour","ornament","glow"];
const buttons=[...document.querySelectorAll('[role=tab]')];
const panel=document.querySelector('.detail');

function moveHighlight(immediate=false){

 panel.dataset.look=looks[index];
 document.querySelector('.panel-copy h1').textContent=services[index][0];
 document.querySelector('#visual-description').textContent=services[index][1];
 moveHighlight();
}
buttons.forEach((button,i)=>{
 button.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')select(i)});
 button.addEventListener('click',()=>select(i));
 button.addEventListener('focus',()=>select(i));
 button.addEventListener('keydown',e=>{
 let next=i;if(e.key==='ArrowDown')next=(i+1)%buttons.length;else if(e.key==='ArrowUp')next=(i-1+buttons.length)%buttons.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=buttons.length-1;else return;
 e.preventDefault();buttons[next].focus();
 });
});
new ResizeObserver(()=>moveHighlight(true)).observe(list);
reduced.addEventListener('change',()=>moveHighlight(true));
moveHighlight(true);
</script>
